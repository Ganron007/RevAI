<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1380" viewBox="0 0 2000 1380" role="img" aria-label="RevAI malware reverse-engineering agentic pipeline architecture v2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243429"/><stop offset="55%" stop-color="#16211b"/><stop offset="100%" stop-color="#0c130f"/>
    </linearGradient>
    <radialGradient id="topglow" cx="50%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#2f6b48" stop-opacity="0.55"/><stop offset="100%" stop-color="#2f6b48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d6052"/><stop offset="46%" stop-color="#2d3b32"/><stop offset="100%" stop-color="#19231d"/>
    </linearGradient>
    <linearGradient id="nodeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#235c3e"/><stop offset="48%" stop-color="#143524"/><stop offset="100%" stop-color="#0c2016"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f7e74"/><stop offset="50%" stop-color="#d2dbd4"/><stop offset="100%" stop-color="#647369"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/></filter>
    <filter id="gE" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#34d399" flood-opacity="0.9"/></filter>
    <filter id="gA" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#f5b92e" flood-opacity="0.9"/></filter>
    <marker id="aO" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8853a"/></marker>
    <marker id="aG" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0a4"/></marker>
    <marker id="aE" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="aA" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b92e"/></marker>
  </defs>

  <rect x="0" y="0" width="2000" height="1380" fill="url(#bg)"/>
  <rect x="0" y="0" width="2000" height="500" fill="url(#topglow)"/>

  <!-- Title Banner -->
  <text x="1000" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">RevAI: Malware RE Agentic Pipeline</text>
  <text x="1000" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#a7b8ac">LLM-based analysis · Agentic LangGraph deep dive · Evidence Pack grounding (no RAG) · truly_green quality gate</text>

  <!-- ===== TOP BAR: CONTROL & INTELLIGENCE LAYER ===== -->
  <!-- Analyst Browser -->
  <g filter="url(#sh)">
    <ellipse cx="180" cy="200" rx="46" ry="14" fill="url(#cyl)"/>
    <rect x="134" y="200" width="92" height="52" fill="url(#cyl)"/>
    <ellipse cx="180" cy="252" rx="46" ry="14" fill="#566459"/>
    <ellipse cx="180" cy="200" rx="46" ry="14" fill="#e6ede8"/>
  </g>
  <text x="180" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef3ef">Analyst Browser</text>

  <!-- RevAI Console -->
  <g filter="url(#sh)">
    <rect x="540" y="150" width="480" height="140" rx="18" fill="url(#node)" stroke="#5f7163" stroke-width="2"/>
    <rect x="552" y="160" width="456" height="28" rx="12" fill="url(#sheen)"/>
    <g transform="translate(570,195)" fill="none" stroke="#cdd6cf" stroke-width="3">
      <rect x="0" y="0" width="54" height="38" rx="6"/><path d="M9 25 l7 -9 l5 6 l7 -11" stroke="#34d399"/><path d="M20 44 h14" stroke-linecap="round"/>
    </g>
    <text x="650" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">RevAI Console</text>
    <text x="650" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b9c7bd">Flask + React · Orchestrator Cockpit</text>
  </g>

  <!-- LLM Judge + Agentic Planner -->
  <g filter="url(#gE)">
    <rect x="1360" y="150" width="520" height="140" rx="18" fill="url(#nodeG)" stroke="#34d399" stroke-width="3"/>
    <rect x="1372" y="160" width="496" height="28" rx="12" fill="url(#sheen)" opacity="0.5"/>
  </g>
  <text x="1620" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#d6ffe9">LLM Judge + Agentic Planner</text>
  <text x="1620" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#86f0bf">LangGraph ReAct · OpenAI-compatible</text>

  <!-- Top horizontal connectors -->
  <line x1="230" y1="220" x2="530" y2="220" stroke="#9fb0a4" stroke-width="4" marker-end="url(#aG)"/>
  <line x1="1020" y1="220" x2="1350" y2="220" stroke="#34d399" stroke-width="4" marker-end="url(#aE)"/>
  <text x="1185" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#86f0bf">orchestration policy</text>

  <!-- ===== PIPELINE CONTAINER ===== -->
  <rect x="70" y="360" width="1860" height="920" rx="30" fill="#101a14" fill-opacity="0.55" stroke="#33473a" stroke-width="2.5"/>
  <text x="1000" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">REMnux Malware Analysis Pipeline (7 Stages)</text>
  <text x="1000" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7f9184">Execution modes: Scripted (deterministic spine) · Agentic (LangGraph ReAct planner + bounded retries) · Console (interactive)</text>

  <!-- Top-to-Pipeline Control Connections (No crossings) -->
  <path d="M 720 290 C 720 380 270 380 270 470" fill="none" stroke="#9fb0a4" stroke-width="4" marker-end="url(#aG)"/>
  <text x="410" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#a7b8ac">drives pipeline</text>

  <path d="M 1500 290 C 1500 380 1080 380 1080 470" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#aE)"/>
  <text x="1330" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#86f0bf">agentic RE planner</text>

  <!-- ===== PHASE 1: INGESTION & TRIAGE (ROW 1, y=480..610) ===== -->
  <!-- 1 Intake -->
  <g filter="url(#sh)"><rect x="110" y="480" width="320" height="130" rx="16" fill="url(#node)" stroke="#5f7163" stroke-width="2"/><rect x="120" y="490" width="300" height="26" rx="12" fill="url(#sheen)"/></g>
  <circle cx="142" cy="518" r="15" fill="#34d399"/><text x="142" y="523" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#06281a">1</text>
  <text x="170" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Intake</text>
  <text x="140" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">Ghidra / IDA → SQLite DB</text>

  <!-- 2 Triage -->
  <g filter="url(#sh)"><rect x="520" y="480" width="320" height="130" rx="16" fill="url(#node)" stroke="#5f7163" stroke-width="2"/><rect x="530" y="490" width="300" height="26" rx="12" fill="url(#sheen)"/></g>
  <circle cx="552" cy="518" r="15" fill="#34d399"/><text x="552" y="523" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#06281a">2</text>
  <text x="580" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Quick Scan (Triage)</text>
  <text x="550" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#b9c7bd">28 tools · capa · Malcat · YARA · revai-tools</text>

  <!-- 3 Deep Dive -->
  <g filter="url(#sh)"><rect x="920" y="480" width="320" height="130" rx="16" fill="url(#node)" stroke="#5f7163" stroke-width="2"/><rect x="930" y="490" width="300" height="26" rx="12" fill="url(#sheen)"/></g>
  <circle cx="952" cy="518" r="15" fill="#34d399"/><text x="952" y="523" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#06281a">3</text>
  <text x="980" y="524" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Deep Dive</text>
  <text x="950" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">Agentic LangGraph · SQL-first</text>

  <!-- Stage 1 -> Stage 2 -> Stage 3 horizontal flow -->
  <line x1="430" y1="545" x2="510" y2="545" stroke="#e8853a" stroke-width="5" marker-end="url(#aO)"/>
  <line x1="840" y1="545" x2="910" y2="545" stroke="#e8853a" stroke-width="5" marker-end="url(#aO)"/>

  <!-- ===== MIDDLE ZONE: EVIDENCE PACK & HITL GATE (y=670..860) ===== -->
  <!-- Evidence Pack Box (The grounding store) -->
  <g filter="url(#sh)">
    <rect x="580" y="660" width="480" height="100" rx="16" fill="#12271b" stroke="#34d399" stroke-width="2.5"/>
    <rect x="592" y="668" width="456" height="22" rx="10" fill="url(#sheen)" opacity="0.4"/>
  </g>
  <g transform="translate(605,675)" fill="none" stroke="#86f0bf" stroke-width="2.2"><ellipse cx="12" cy="4" rx="11" ry="4"/><path d="M1 4 v7 a11 4 0 0 0 22 0 v-7"/><path d="M1 11 v7 a11 4 0 0 0 22 0 v-7"/></g>
  <text x="645" y="694" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#d6ffe9">Evidence Pack (Stage-Tagged Store)</text>
  <text x="605" y="736" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#86f0bf">Aggregates tool outputs from Triage &amp; Deep Dive into structured cards</text>

  <!-- Inputs into Evidence Pack -->
  <path d="M 680 610 L 680 650" fill="none" stroke="#9fb0a4" stroke-width="3" marker-end="url(#aG)"/>
  <path d="M 1080 610 L 1080 635 L 940 635 L 940 650" fill="none" stroke="#9fb0a4" stroke-width="3" marker-end="url(#aG)"/>

  <!-- Direct Feedback UP to LLM Judge (Explicitly shows Grounding - No RAG) -->
  <path d="M 1060 690 C 1200 690 1720 520 1720 300" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#aE)"/>
  <text x="1450" y="580" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#86f0bf">grounds LLM Judge &amp; Publisher (no RAG)</text>

  <!-- HITL Approval Gate (optional) -->
  <g filter="url(#gA)">
    <rect x="580" y="800" width="480" height="95" rx="16" fill="#3a2a08" stroke="#f5b92e" stroke-width="3"/>
    <rect x="592" y="808" width="456" height="20" rx="10" fill="url(#sheen)" opacity="0.35"/>
  </g>
  <text x="820" y="834" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffe6a3">HITL Approval Gate (optional)</text>
  <text x="820" y="865" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f5b92e">Verdict conflict check: Quick (Triage) vs Deep verdict lock</text>

  <!-- Input from Evidence Pack to HITL -->
  <line x1="820" y1="760" x2="820" y2="792" stroke="#f5b92e" stroke-width="4" marker-end="url(#aA)"/>

  <!-- Pipeline Main Spine Downward Transfer (Stage 3 -> Stage 4) -->
  <path d="M 1240 545 L 1320 545 L 1320 925 L 270 925 L 270 930" fill="none" stroke="#e8853a" stroke-width="5" marker-end="url(#aO)"/>

  <!-- HITL Output into Stage 5 Publish -->
  <path d="M 820 895 L 820 930" fill="none" stroke="#f5b92e" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#aA)"/>
  <text x="835" y="915" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffe6a3">approved</text>

  <!-- ===== PHASE 3: GENERATION & VERIFICATION (ROW 2, y=940..1070) ===== -->
  <!-- 4 Rule Gen -->
  <g filter="url(#sh)"><rect x="110" y="940" width="320" height="130" rx="16" fill="url(#node)" stroke="#5f7163" stroke-width="2"/><rect x="120" y="950" width="300" height="26" rx="12" fill="url(#sheen)"/></g>
  <circle cx="142" cy="978" r="15" fill="#34d399"/><text x="142" y="983" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#06281a">4</text>
  <text x="170" y="984" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Rule Gen</text>
  <text x="140" y="1035" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">YARA + Sigma generation</text>

  <!-- 5 Publish -->
  <g filter="url(#sh)"><rect x="520" y="940" width="320" height="130" rx="16" fill="url(#node)" stroke="#5f7163" stroke-width="2"/><rect x="530" y="950" width="300" height="26" rx="12" fill="url(#sheen)"/></g>
  <circle cx="552" cy="978" r="15" fill="#34d399"/><text x="552" y="983" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#06281a">5</text>
  <text x="580" y="984" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Publish Report</text>
  <text x="550" y="1035" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">source-tagged + provenance-stamped</text>

  <!-- 6 Correlate -->
  <g filter="url(#sh)"><rect x="920" y="940" width="320" height="130" rx="16" fill="url(#node)" stroke="#5f7163" stroke-width="2"/><rect x="930" y="950" width="300" height="26" rx="12" fill="url(#sheen)"/></g>
  <circle cx="952" cy="978" r="15" fill="#34d399"/><text x="952" y="983" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#06281a">6</text>
  <text x="980" y="984" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Correlate</text>
  <text x="950" y="1035" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">section Map-Reduce report</text>

  <!-- 7 Audit + Gate -->
  <g filter="url(#gE)"><rect x="1330" y="940" width="340" height="130" rx="16" fill="url(#nodeG)" stroke="#34d399" stroke-width="2.5"/><rect x="1342" y="950" width="316" height="26" rx="12" fill="url(#sheen)" opacity="0.5"/></g>
  <circle cx="1364" cy="978" r="15" fill="#ffffff"/><text x="1364" y="983" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#0c2016">7</text>
  <text x="1394" y="984" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#d6ffe9">Audit + Quality Gate</text>
  <text x="1360" y="1035" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#86f0bf">truly_green quality gate</text>

  <!-- Row 2 horizontal flow -->
  <line x1="430" y1="1005" x2="510" y2="1005" stroke="#e8853a" stroke-width="5" marker-end="url(#aO)"/>
  <line x1="840" y1="1005" x2="910" y2="1005" stroke="#e8853a" stroke-width="5" marker-end="url(#aO)"/>
  <line x1="1240" y1="1005" x2="1320" y2="1005" stroke="#e8853a" stroke-width="5" marker-end="url(#aO)"/>

  <!-- ===== OUTPUTS LAYER (y=1140..1220) ===== -->
  <!-- Output 1: Signatures -->
  <g filter="url(#sh)">
    <rect x="130" y="1140" width="280" height="68" rx="12" fill="url(#node)" stroke="#5f7163" stroke-width="2"/>
    <path d="M150 1155 h16 l7 7 v26 a4 4 0 0 1 -4 4 h-19 a4 4 0 0 1 -4 -4 v-29 a4 4 0 0 1 4 -4 z" fill="none" stroke="#9fb0a4" stroke-width="2"/>
    <path d="M166 1155 v7 h7" fill="none" stroke="#9fb0a4" stroke-width="2"/>
    <text x="185" y="1173" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3ef">YARA / Sigma</text>
    <text x="185" y="1192" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">Signatures</text>
  </g>
  <line x1="270" y1="1070" x2="270" y2="1132" stroke="#9fb0a4" stroke-width="4" marker-end="url(#aG)"/>

  <!-- Output 2: Markdown Reports -->
  <g filter="url(#sh)">
    <rect x="670" y="1140" width="400" height="68" rx="12" fill="url(#node)" stroke="#5f7163" stroke-width="2"/>
    <path d="M690 1155 h16 l7 7 v26 a4 4 0 0 1 -4 4 h-19 a4 4 0 0 1 -4 -4 v-29 a4 4 0 0 1 4 -4 z" fill="none" stroke="#9fb0a4" stroke-width="2"/>
    <path d="M706 1155 v7 h7" fill="none" stroke="#9fb0a4" stroke-width="2"/>
    <text x="725" y="1173" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef3ef">Technical Markdown Reports</text>
    <text x="725" y="1192" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b9c7bd">REPORT-MASTER &amp; REPORT-TECHNICAL</text>
  </g>
  <line x1="680" y1="1070" x2="770" y2="1132" stroke="#9fb0a4" stroke-width="4" marker-end="url(#aG)"/>
  <line x1="1080" y1="1070" x2="970" y2="1132" stroke="#9fb0a4" stroke-width="4" marker-end="url(#aG)"/>

  <!-- Output 3: truly_green -->
  <g filter="url(#gE)">
    <rect x="1370" y="1140" width="260" height="68" rx="12" fill="url(#nodeG)" stroke="#34d399" stroke-width="2.5"/>
    <text x="1500" y="1172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#d6ffe9">truly_green</text>
    <text x="1500" y="1193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#86f0bf">verified verdict</text>
  </g>
  <line x1="1500" y1="1070" x2="1500" y2="1132" stroke="#34d399" stroke-width="4" marker-end="url(#aE)"/>

  <!-- Legend -->
  <g transform="translate(500,1330)" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#cdd6cf">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#e8853a" stroke-width="5"/><text x="50" y="5">data spine flow</text>
    <line x1="200" y1="0" x2="240" y2="0" stroke="#34d399" stroke-width="4" stroke-dasharray="8 6"/><text x="250" y="5">LLM / evidence grounding</text>
    <line x1="500" y1="0" x2="540" y2="0" stroke="#f5b92e" stroke-width="4" stroke-dasharray="7 5"/><text x="550" y="5">human-in-the-loop</text>
    <line x1="760" y1="0" x2="800" y2="0" stroke="#9fb0a4" stroke-width="4"/><text x="810" y="5">control / outputs</text>
  </g>
</svg>