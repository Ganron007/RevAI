<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-label="RevAI logo">
  <defs>
    <!-- Base Shield Gradient (Dark forest to deep emerald) -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="55%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <!-- Wordmark Gradient (Vibrant green to medium emerald) -->
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Shield icon with malware bug and AI-extraction sparkle -->
  <g transform="translate(24,28)">
    <!-- Sleek outer shield path -->
    <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z"
          fill="url(#greenGrad)" stroke="#022c22" stroke-width="2"/>
    
    <!-- Bug Antennae -->
    <path d="M52 46 Q47 38 41 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M58 46 Q63 38 69 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Bug Legs -->
    <path d="M45 64 Q35 60 29 65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M65 64 Q75 60 81 65" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M45 73 Q32 73 26 78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M65 73 Q78 73 84 78" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M45 82 Q34 85 30 95" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <path d="M65 82 Q76 85 80 95" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

    <!-- Bug Body -->
    <rect x="44" y="55" width="22" height="38" rx="11" fill="#ffffff" opacity="0.95"/>
    
    <!-- Bug Head -->
    <circle cx="55" cy="49" r="6" fill="#ffffff" opacity="0.95"/>

    <!-- AI Sparkle Cutout (matching shield gradient underneath) -->
    <path d="M55 62 Q55 74 63 74 Q55 74 55 86 Q55 74 47 74 Q55 74 55 62 Z" fill="url(#greenGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="url(#wordGrad)" letter-spacing="-1">RevAI</text>

  <!-- Tagline under the wordmark -->
  <text x="162" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.4">Autonomous Malware Decompilation &amp; Deobfuscation</text>
</svg>
