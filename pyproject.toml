[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revai"
version = "0.1.0"
description = "LLM-assisted malware reverse-engineering pipeline with an agentic LangGraph deep dive."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "RevAI Team" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Ganron007/RevAI"

[tool.setuptools]
packages = ["revai"]
